<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f58a0a"><title>アクセス解析 | Bitcoin1070 PRO v16.4</title><link rel="stylesheet" href="style.css?v=15.0"><style>.analytics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.analytics-kpi{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.03)}.analytics-kpi small{display:block;opacity:.65}.analytics-kpi strong{font-size:26px}.analytics-list{display:grid;gap:8px}.analytics-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}.analytics-tabs{display:flex;gap:8px}.analytics-tabs button{flex:1}.analytics-note{font-size:12px;opacity:.7;line-height:1.6}@media(min-width:700px){.analytics-grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="app-header"><div class="app-brand">₿ Bitcoin1070 PRO <span>v16.4</span></div><h1>📊 アクセス解析</h1><p>収益化に向けた利用状況ダッシュボード</p></header><main class="container app-page"><a class="page-back-link" href="settings.html">← 設定へ戻る</a><section class="card"><div class="analytics-tabs"><button data-days="1">今日</button><button data-days="7">7日</button><button data-days="30">30日</button></div><div class="analytics-grid" style="margin-top:14px"><div class="analytics-kpi"><small>ページ閲覧</small><strong id="aViews">0</strong></div><div class="analytics-kpi"><small>セッション</small><strong id="aSessions">0</strong></div><div class="analytics-kpi"><small>機能利用</small><strong id="aFeatures">0</strong></div><div class="analytics-kpi"><small>記録イベント</small><strong id="aEvents">0</strong></div></div></section><section class="card"><h2>🔥 人気ページ</h2><div id="aPages" class="analytics-list"></div></section><section class="card"><h2>🧠 人気機能</h2><div id="aFeatureList" class="analytics-list"></div></section><section class="card"><h2>🔗 流入元</h2><div id="aSources" class="analytics-list"></div></section><section class="card"><h2>📱 端末</h2><div id="aDevices" class="analytics-list"></div></section><section class="card"><h2>🔐 データについて</h2><p class="analytics-note">現在のv16.4基盤はこの端末内だけに匿名イベントを保存します。保有数量・取得単価・売買金額などの投資データは解析イベントに記録しません。他ユーザー全体のアクセス数を集計するには、次段階でサーバー側集計またはGA4等への接続が必要です。</p><div class="setting-menu"><button id="aExport">解析データを書き出す</button><button id="aClear" class="danger-button">この端末の解析履歴を削除</button></div></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span><small>ホーム</small></a><a href="market.html"><span>📈</span><small>相場</small></a><a href="portfolio.html"><span>💼</span><small>資産</small></a><a href="news.html"><span>📰</span><small>情報</small></a><a href="settings.html" class="active"><span>⚙️</span><small>設定</small></a></nav><script src="analytics-tracker.js?v=16.4"></script><script src="analytics-dashboard.js?v=16.4"></script><script src="app-shell.js?v=16.3.1"></script></body></html>
