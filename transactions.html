<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f58a0a"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-512.PNG">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>売買台帳 | Bitcoin1070 PRO v13.1</title><link rel="stylesheet" href="style.css?v=13.1"></head><body>
<header class="app-header"><div class="app-brand">₿ Bitcoin1070 PRO <span>v13.1</span></div><h1>📒 売買台帳</h1><p>買付・売却・日本円の入出金を記録</p></header>
<main class="container app-page ledger-page">
<section class="card ledger-cash"><span class="eyebrow">JPY CASH BALANCE</span><h2 id="ledgerCash">¥0</h2><p class="small">取引を登録すると日本円残高へ自動反映されます。</p></section>
<section class="card realized-section"><div class="section-heading-row"><div><span class="eyebrow">REALIZED P&amp;L</span><h2>実現損益</h2></div><small>売却済み取引</small></div><div class="realized-summary"><div><span id="ledgerRealizedYearLabel">今年</span><strong id="ledgerRealizedYear">--</strong><small id="ledgerYearSellCount">0回</small></div><div><span>累計</span><strong id="ledgerRealizedTotal">--</strong><small id="ledgerSellCount">0回</small></div></div><div id="realizedByAsset" class="realized-assets"></div></section>
<section class="card"><h2>取引を登録</h2><div class="ledger-tabs" role="group" aria-label="取引種別"><button type="button" data-kind="BUY" class="active">買付</button><button type="button" data-kind="SELL">売却</button><button type="button" data-kind="DEPOSIT">入金</button><button type="button" data-kind="WITHDRAWAL">出金</button></div>
<form id="ledgerForm"><input id="ledgerKind" type="hidden" value="BUY"><input id="tradeSymbol" type="hidden"><input id="tradeName" type="hidden"><div class="ledger-form-grid"><label>取引日時<input id="tradeDate" type="datetime-local" required></label><label id="assetTypeLabel">資産種類<select id="tradeType"><option value="jp">日本株</option><option value="us">米国株</option><option value="crypto">仮想通貨</option></select></label><label class="trade-only ledger-asset-search">銘柄を検索<input id="tradeAssetSearch" type="search" autocomplete="off" autocapitalize="characters" placeholder="285A / きおくしあ / NVDA / Bitcoin" aria-controls="tradeAssetSuggestions" aria-expanded="false"><span class="field-hint">1文字から検索できます</span><div id="tradeAssetSuggestions" class="asset-suggestions hidden" role="listbox"></div></label><div id="selectedTradeAsset" class="trade-only selected-trade-asset hidden" aria-live="polite"></div><label class="trade-only">数量<input id="tradeQuantity" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label><label class="trade-only">約定単価 <span id="priceUnit">円</span><input id="tradePrice" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label><label id="fxField" class="trade-only hidden">約定時 USD/JPY<input id="tradeFx" type="number" inputmode="decimal" min="0" step="any" placeholder="例: 150.25"></label><label class="trade-only">手数料（円・任意）<input id="tradeFee" type="number" inputmode="decimal" min="0" step="any" value="0"></label><label id="cashAmountField" class="hidden">金額（円）<input id="cashAmount" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label></div><p id="ledgerEstimate" class="ledger-estimate" aria-live="polite"></p><p id="ledgerError" class="form-error" aria-live="assertive"></p><button class="full-width-button" type="submit">登録して残高へ反映</button></form></section>
<section class="card"><div class="section-heading-row"><div><span class="eyebrow">TRANSACTION HISTORY</span><h2>取引履歴</h2></div><small>新しい順</small></div><div id="ledgerHistory"></div></section>
</main><nav class="bottom-nav" aria-label="メインメニュー"><a href="index.html"><span>⌂</span><small>ホーム</small></a><a href="market.html"><span>📈</span><small>相場</small></a><a href="portfolio.html" class="active"><span>💼</span><small>資産</small></a><a href="news.html"><span>📰</span><small>情報</small></a><a href="settings.html"><span>⚙️</span><small>設定</small></a></nav>
<script src="storage.js?v=13.1"></script><script src="asset-master.js?v=13.1"></script><script src="asset-search.js?v=13.1"></script><script src="transactions.js?v=13.1"></script><script src="app-shell.js?v=13.1"></script><script src="premium-ux.js?v=13.1"></script></body></html>
